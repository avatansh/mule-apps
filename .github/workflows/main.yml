# Thin caller — MUnit via the shared reusable workflow (avatansh/mule-ci-cd).
# Monorepo: module-path targets the upgraded app so un-upgraded siblings are not
# MUnit-tested on Java 17. Pin @main to a tag once mule-ci-cd is released.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [develop, main]

jobs:
  munit:
    uses: avatansh/mule-ci-cd/.github/workflows/munit.yml@main
    with:
      module-path: customer-web-eapi
    secrets: inherit
