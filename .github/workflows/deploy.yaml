# Thin caller — deploy on merge via the shared reusable workflow. The reusable
# deploy-ch2.yml now also reports cd-result to the orchestrator, so no bespoke
# notify job is needed here. Pin @main to a tag once mule-ci-cd is released.
name: Deploy to CH2.0

on:
  pull_request:
    types: [closed]

jobs:
  deploy:
    if: ${{ github.event.pull_request.merged == true }}
    uses: avatansh/mule-ci-cd/.github/workflows/deploy-ch2.yml@main
    with:
      environment: dev
      module-path: customer-web-eapi
      extra-maven-args: "-Dch2.runtimeEnv=dev"
    secrets: inherit
